<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Hay Olas?">
<meta name="theme-color" content="#061021">
<link rel="icon" type="image/png" href="logo.png">
<title>¿Hay Olas? — Chile</title>
<style>
  :root{
    --bg-top:#0B2545;
    --bg-bot:#061021;
    --glass:rgba(255,255,255,0.08);
    --glass-strong:rgba(255,255,255,0.13);
    --glass-line:rgba(255,255,255,0.14);
    --glass-line-bright:rgba(255,255,255,0.28);
    --ink:#F7F5EF;
    --ink-dim:rgba(247,245,239,0.62);
    --ink-faint:rgba(247,245,239,0.4);
    --red:#D22B3A;
    --go:#3FC79A;
    --maybe:#E0A83E;
    --skip:#D22B3A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #14315C 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    /* iOS safe areas — the status bar / home indicator areas.
       Fallbacks are for browsers that don't support env() yet. */
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
    padding-left: env(safe-area-inset-left, 0);
    padding-right: env(safe-area-inset-right, 0);
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:26px 18px max(56px, calc(56px + env(safe-area-inset-bottom, 0px)));
  }

  /* ---------- Header ---------- */
  header{
    margin-bottom:18px;
    /* When added to home screen on iOS, push below the status bar.
       In Safari (non-PWA), add a minimum so the header doesn't sit
       under the dynamic island / status bar. */
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .logo{width:52px; height:52px; flex:0 0 auto; border-radius:8px;}
  .brand-text h1{
    font-size:clamp(22px,6vw,28px);
    font-weight:700;
    letter-spacing:-0.025em;
    margin:0;
    line-height:1.1;
  }
  .brand-text .subtitle{
    margin:2px 0 0;
    font-size:11px;
    color:var(--ink-faint);
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .partner-logo{
    width:74px;
    height:auto;
    flex:0 0 auto;
    margin-left:auto;
    opacity:0.85;
    border-radius:4px;
  }

  /* ---------- Region selector ---------- */
  .region-selector{margin-top:16px;}
  .select-wrap{position:relative;}
  .region-select{
    width:100%;
    padding:11px 38px 11px 14px;
    background:var(--glass);
    border:1px solid var(--glass-line);
    border-top-color:var(--glass-line-bright);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-radius:12px;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    letter-spacing:0.01em;
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
  }
  .region-select option{background:#0B2545; color:var(--ink);}
  .select-chevron{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    pointer-events:none;
    color:var(--ink);
    font-size:11px;
    line-height:1;
  }

  .segmented{
    position:relative;
    display:flex;
    margin-top:10px;
    background:var(--glass);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-radius:12px;
    padding:3px;
  }
  .seg-pill{
    position:absolute;
    top:3px; bottom:3px;
    width:calc(33.333% - 4px);
    background:var(--red);
    border-radius:9px;
    transition:transform 320ms cubic-bezier(.2,.8,.2,1);
    box-shadow:0 2px 10px rgba(210,43,58,0.35);
  }
  .level-btn{
    position:relative;
    z-index:1;
    flex:1;
    padding:9px 4px;
    border:none;
    background:transparent;
    color:var(--ink-dim);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
    border-radius:9px;
    transition:color 200ms ease;
  }
  .level-btn.active{color:#fff;}
  .level-btn:active{transform:scale(0.97);}

  /* ---------- Glass card base ---------- */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-line);
    border-top-color:var(--glass-line-bright);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-radius:16px;
  }

  /* ---------- Hero ---------- */
  .hero{padding:20px 20px 16px; margin-top:16px;}
  .hero-label{
    font-size:11px; font-weight:600;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:0 0 2px;
  }
  .hero-spot{
    font-size:19px; font-weight:700;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .hero-main{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .hero-num{
    font-size:clamp(46px,14vw,60px);
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:0.95;
  }
  .hero-num small{font-size:0.4em; font-weight:600; letter-spacing:-0.01em; color:var(--ink-dim); margin-left:2px;}
  /* Hero verdict: vertical stack — big pin on top, label below the number */
  .verdict-pill{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    margin-bottom:2px;
  }
  .verdict-pill img{
    width:44px;   /* ratio 253:322 → 0.786 */
    height:56px;
    flex:0 0 auto;
    display:block;
  }
  .verdict-pill .v-label{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    line-height:1;
    text-align:center;
  }
  /* Card tag in "Otros spots" (no longer shown — verdict is implicit) */
  .verdict-tag{display:none;}
  /* Day-box verdict (no longer shown) */
  .verdict-day{display:none;}

  .meta-row{
    display:flex;
    gap:16px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--glass-line);
    flex-wrap:wrap;
  }
  .meta{min-width:58px;}
  .meta .n{
    font-size:15px; font-weight:600;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:3px;
  }
  .meta .l{font-size:11px; color:var(--ink-faint); display:block; margin-top:1px;}
  .arrow{
    display:inline-block;
    font-size:12px;
    line-height:1;
  }
  .updated{font-size:11px; color:var(--ink-faint); margin:14px 0 0;}

  .reason{
    margin:14px 0 0;
    padding-top:14px;
    border-top:1px solid var(--glass-line);
    font-size:12.5px;
    color:var(--ink-faint);
    line-height:1.5;
  }

  .daily-detail{
    display:flex; gap:8px;
    margin-top:12px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .daily-detail::-webkit-scrollbar{display:none;}
  .day-box{
    flex:0 0 auto;
    min-width:62px;
    text-align:center;
    padding:8px 6px;
    border-radius:10px; background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-line);
    cursor:pointer;
    transition:background 150ms ease, transform 150ms ease;
  }
  .day-box.has-best{cursor:pointer;}
  .day-box.has-best:hover{background:rgba(255,255,255,0.10);}
  .day-box.has-best:active{transform:scale(0.96);}
  .day-box.selected{
    background:rgba(210,43,58,0.18);
    border-color:rgba(210,43,58,0.55);
  }
  .day-box .dl{font-size:10.5px; color:var(--ink-faint); font-weight:600; text-transform:capitalize;}
  .day-box .dv-row{margin-top:4px;}

  /* ---------- Tide chart ---------- */
  .tide{margin-top:16px; padding-top:14px; border-top:1px solid var(--glass-line);}
  .tide-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:8px;
  }
  .tide-head .lbl{
    font-size:11px; font-weight:600;
    color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .tide-head .state{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600;
    color:var(--ink-dim);
  }
  .tide-head .state .arr{font-size:10px; line-height:1; transition:transform 200ms ease;}
  .tide-head .state.up .arr{transform:rotate(-90deg); color:var(--go);}
  .tide-head .state.down .arr{transform:rotate(90deg); color:#6FA8DC;}
  .tide-extras{
    display:flex; gap:12px;
    font-size:10.5px; color:var(--ink-faint);
    margin-top:6px;
  }
  .tide-extras span b{color:var(--ink-dim); font-weight:600;}

  .tide-chart{
    position:relative;
    width:100%;
    height:72px;
    overflow:visible;
  }
  .tide-chart svg{width:100%; height:100%; display:block;}
  .tide-xaxis{
    display:flex; justify-content:space-between;
    margin-top:4px;
    font-size:9.5px; color:var(--ink-faint); font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .tide-empty{
    height:72px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--ink-faint);
  }

  /* Tooltip floating on the tide chart */
  .tide-tooltip{
    position:absolute;
    transform:translate(-50%, -100%);
    background:rgba(8, 17, 31, 0.92);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:8px;
    padding:6px 9px 7px;
    pointer-events:none;
    white-space:nowrap;
    font-size:11px;
    line-height:1.35;
    color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
    opacity:0;
    transition:opacity 120ms ease;
    z-index:5;
  }
  .tide-tooltip.show{opacity:1;}
  .tide-tooltip .t-time{font-weight:700; font-variant-numeric:tabular-nums; margin-bottom:2px;}
  .tide-tooltip .t-row{display:flex; align-items:center; gap:6px; color:var(--ink-dim); font-size:10.5px;}
  .tide-tooltip .t-row b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
  .tide-tooltip .t-arr{font-size:9px; line-height:1;}
  .tide-tooltip .t-arr.up{color:var(--go);}
  .tide-tooltip .t-arr.down{color:#6FA8DC;}

  .tide-hit{
    fill:transparent;
    cursor:crosshair;
  }
  .tide-cursor{
    opacity:0;
    transition:opacity 120ms ease;
  }
  .tide-chart:hover .tide-cursor{opacity:1;}
  .tide-dot-hover{filter:drop-shadow(0 0 4px rgba(255,255,255,0.6));}

  /* ---------- Animations ---------- */
  /* Re-render fade: applied to the hero, the list, and the tide block.
     The .anim-in class is added on render, removed on animationend. */
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes popIn{
    0%  { opacity:0; transform:scale(0.85); }
    60% { opacity:1; transform:scale(1.06); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes tickIn{
    from{ opacity:0; transform:translateY(-4px); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes selectPulse{
    0%  { transform:scale(1); }
    40% { transform:scale(1.08); }
    100% { transform:scale(1); }
  }
  @keyframes tideDraw{
    from{ stroke-dashoffset:600; }
    to  { stroke-dashoffset:0; }
  }
  @keyframes tideFade{
    from{ opacity:0; }
    to  { opacity:1; }
  }
  @keyframes nowMove{
    from{ opacity:0; }
    to  { opacity:1; }
  }

  .anim-fade-up{ animation: fadeUp 600ms cubic-bezier(.2,.8,.2,1) both; }
  .anim-pop   { animation: popIn  600ms cubic-bezier(.2,.8,.2,1) both; }
  .anim-tick  { animation: tickIn 350ms ease-out both; }
  .anim-tide  { animation: tideFade 700ms ease-out both; }

  /* Staggered entry for the day-boxes and the cards list.
     We use --i (the index) passed inline to delay each one. */
  .stagger > *{
    animation: fadeUp 500ms cubic-bezier(.2,.8,.2,1) both;
    animation-delay: calc(var(--i, 0) * 60ms);
  }

  /* The selected day-box pulses when it becomes selected.
     The animation is re-triggered via JS (toggle a class then requestAnimationFrame). */
  .day-box.pulse{ animation: selectPulse 400ms ease-out; }
  .day-box.selected{ background:rgba(210,43,58,0.18); border-color:rgba(210,43,58,0.55); }

  /* The tide curve draws itself in on first render.
     Length is set inline (via JS) using path.getTotalLength() so the
     dasharray matches the actual path length. */
  .tide-curve{
    stroke-dasharray:var(--len, 1000);
    stroke-dashoffset:var(--len, 1000);
    animation: tideDraw 1500ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .tide-curve-bg{
    animation: tideFade 800ms ease-out both;
  }
  .tide-now-marker{
    animation: nowMove 500ms ease-out both;
    animation-delay: 1000ms;
  }

  /* Animations are always on. We previously respected prefers-reduced-motion,
     but it was making the app feel static in some setups. Re-enable here if
     needed for accessibility. */
  /*
  @media (prefers-reduced-motion: reduce){
    .anim-fade-up, .anim-pop, .anim-tick, .anim-tide,
    .stagger > *, .day-box.selected,
    .tide-curve, .tide-curve-bg, .tide-now-marker{
      animation: none !important;
    }
    .tide-curve{ stroke-dasharray:none; stroke-dashoffset:0; }
  }
  */

  /* ---------- Hourly strip ---------- */
  .hourly-wrap{margin-top:12px; padding-top:6px;}
  .hourly-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:4px 20px 4px;
    margin:0 -20px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    overscroll-behavior-x:contain;
    cursor:grab;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  }
  .hourly-scroll::-webkit-scrollbar{display:none;}
  .hourly-scroll.dragging{cursor:grabbing;}
  .hourly-scroll.dragging .hour-chip{pointer-events:none;}
  .hour-chip{
    flex:0 0 auto;
    width:56px;
    text-align:center;
    padding:10px 0 8px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-line);
  }
  .hour-chip .t{font-size:11px; color:var(--ink-faint); font-weight:600;}
  .hour-chip .arrow{margin:6px 0; font-size:13px;}
  .hour-chip .h{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}

  /* ---------- Sections ---------- */
  .section-title{
    font-size:13px; font-weight:700;
    color:var(--ink-dim);
    margin:26px 2px 10px;
    letter-spacing:0.01em;
  }

  .card{margin-bottom:10px; overflow:hidden; cursor:pointer; transition:transform 150ms ease, background 150ms ease;}
  .card:active{transform:scale(0.98);}
  .card:hover{background:var(--glass-strong);}
  .card-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
  }
  .card-head .name-wrap{display:flex; align-items:center; gap:9px;}
  .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; display:none;}
  .card-head .name{font-size:15.5px; font-weight:600;}
  .card-head .tag{font-size:12.5px; font-weight:700; letter-spacing:0.01em;}
  .daily-row{display:none;}
  .daily-dot{width:5px; height:5px; border-radius:50%;}

  /* ---------- States ---------- */
  .msg{padding:24px 20px; margin-top:20px; text-align:center; font-size:14px; color:var(--ink-dim);}
  .msg button{
    margin-top:12px; background:var(--red); color:#fff; border:none;
    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .msg button:active{transform:scale(0.97);}

  .reset-hint{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--glass-line);
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
  }
  .reset-hint .reset{
    color:var(--ink-dim);
    text-decoration:underline;
    cursor:pointer;
  }

  footer{margin-top:28px; font-size:11px; color:var(--ink-faint); line-height:1.6; padding:0 2px;}
  footer .footer-logo{width:32px; height:32px; margin:0 0 8px; opacity:0.55; display:block; border-radius:6px;}
  footer a{color:var(--ink-dim);}

  @media (prefers-reduced-motion: reduce){
    .seg-pill, .card, .level-btn{transition:none !important;}
  }
</style>
    <!-- GSAP for premium animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Hay Olas" class="logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <h1>¿Hay Olas?</h1>
        <p class="subtitle">Reporte de Surf · Chile</p>
      </div>
      <img src="team-comba.png" alt="Team Comba" class="partner-logo" onerror="this.style.display='none'">
    </div>

    <div class="region-selector">
      <div class="select-wrap">
        <select id="regionSelect" class="region-select" aria-label="Región">
          <!-- options injected by JS -->
        </select>
        <span class="select-chevron" aria-hidden="true">▾</span>
      </div>
    </div>

    <div class="segmented" id="levelSelect">
      <div class="seg-pill" id="segPill"></div>
      <button class="level-btn" data-level="principiante" data-idx="0">Principiante</button>
      <button class="level-btn" data-level="intermedio" data-idx="1">Intermedio</button>
      <button class="level-btn" data-level="avanzado" data-idx="2">Avanzado</button>
    </div>
  </header>

  <div id="content">
    <div class="glass msg">Leyendo el mar…</div>
  </div>

  <footer>
    <img src="logo.png" alt="" class="footer-logo" onerror="this.style.display='none'">
    Oleaje, viento y temperatura del agua: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
    (modelos ECMWF / GFS / DWD, CC BY 4.0). Marea: SHOA.
  </footer>
</div>

<script>
(function(){

  // ---------------------------------------------------------------
  // Regions: each region has its own list of spots.
  // idealSwellDir / idealWindDir are first-pass heuristics; Curanipe's
  // are based on documented spot data, the others assume the generic
  // Chile-coast default (SW groundswell, E offshore) until refined.
  // ---------------------------------------------------------------
  // ---- Spots by region ----
  // Coordinates are approximate; if any is off, adjust here.
  // idealSwellDir / idealWindDir defaults: [200,260] / [70,110]
  //   (SW groundswell + E offshore) which fits most of the Chilean coast.
  // Notable overrides:
  //   - Curanipe/Pelluhue (Maule N): idealSwellDir [180,270] (S to W works)
  //     and idealWindDir [190,250] (S/SW offshore in that bay).
  //   - Constitución: damped (river mouth).
  // Tide coeffs come from TIDE_COEFFS via the region's tideMaster.

  // GSAP animations test
  function initGSAPAnimations() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  gsap.from('.glass.hero', { opacity: 0, y: 20, duration: 0.8, ease: 'power3.out' });
  gsap.from('.hero-num', { opacity: 0, y: -10, duration: 0.6, ease: 'power2.out' });
  gsap.from('.anim-pop', { opacity: 0, scale: 0.8, duration: 0.6, ease: 'back.out(1.7)' });
  gsap.from('.tide-chart', { opacity: 0, duration: 0.8, ease: 'power3.out' });
  gsap.from('.day-box', { opacity: 0, y: 10, duration: 0.6, ease: 'power3.out', stagger: 0.08 });
  gsap.utils.toArray('.card').forEach((card, i) => {
    const idHash = card.dataset.id ? hashCode(card.dataset.id) : i;
    gsap.to(card, {
      y: () => Math.sin(Date.now() * 0.002 + idHash) * 3,
      duration: 6,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true
    });
  });
  gsap.utils.toArray('.level-btn').forEach(btn => {
    btn.addEventListener('pointerenter', () => gsap.to(btn, { scale: 1.05, duration: 0.2 }));
    btn.addEventListener('pointerleave', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
    btn.addEventListener('pointerdown', () => gsap.to(btn, { scale: 0.95, duration: 0.1 }));
    btn.addEventListener('pointerup', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
  });
  const regionSelect = document.querySelector('.select-wrap');

  };

  // Display order for the region selector. Add region ids here as they
  // become available; the selector is generated from this array.
  const REGION_ORDER = ['arica', 'tarapaca', 'antofagasta', 'atacama', 'coquimbo', 'valparaiso', 'ohiggins', 'maule', 'nuble', 'biobio', 'araucania', 'losrios', 'loslagos', 'aysen', 'magallanes'];

  const LEVEL_RANGES = {
    principiante:{ min:0.5, max:1.0, abovePenalty:25 },
    intermedio:  { min:1.0, max:1.8, abovePenalty:20 },
    avanzado:    { min:1.2, max:3.5, abovePenalty:15 },
  };
  const LEVEL_ORDER = ['principiante','intermedio','avanzado'];
  const SHOW_DEBUG = false; // set to true to see debug scores in console

  // Cache is keyed by region so switching back is instant.
  const CACHE_KEY = 'hayolas_cache_v3';
  const CACHE_TTL_MS = 60 * 60 * 1000;

  // Tides: computed locally with the harmonic model below (no API, no key).
  // The cache key is kept for backwards-compat reads; the new series shape
  // matches what the renderer expects, so old cache entries still work.
  const TIDES_CACHE_KEY = 'hayolas_tides_v1';
  const TIDES_TTL_MS = 7 * 24 * 60 * 60 * 1000; // marea astronómica, 7 días es seguro

  let currentRegion = 'maule';
  let currentLevel  = 'intermedio';
  let raw = null;            // per-spot hourly arrays for the current region
  let tides = null;          // { [spotId]: { times:[iso], heights:[m] } }
  let selectedSpotId = null; // null => top-scored spot is shown as primary
  let selectedDayIdx = null; // 0..4 => show that day's best hour; null => nearest to now

  // ---------------- helpers ----------------
  function angDiff(a,b){ const d=Math.abs(a-b)%360; return d>180?360-d:d; }
  function mid(r){ return (r[0]+r[1])/2; }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

  function nearestIndex(times){
    const now = Date.now();
    let bi=0, bd=Infinity;
    for(let i=0;i<times.length;i++){
      const d = Math.abs(new Date(times[i]).getTime()-now);
      if(d<bd){bd=d; bi=i;}
    }
    return bi;
  }

  function dirLabel(deg){
    const dirs=['N','NE','E','SE','S','SO','O','NO'];
    return dirs[Math.round(deg/45)%8];
  }
  // arrow points where the swell/wind is heading TO (met. convention: deg = coming FROM)
  function arrowSpan(deg){
    return `<span class="arrow" style="transform:rotate(${(deg+180)%360}deg)">↑</span>`;
  }

  function dayKey(iso){ return iso.slice(0,10); }
  function hourNum(iso){ return parseInt(iso.slice(11,13),10); }

  function getCurrentSpots(){ return REGIONS[currentRegion].spots; }

  // Touch already scrolls natively (touch-action:pan-x above handles that).
  // This only adds click-and-drag for mouse/trackpad, plus wheel->horizontal,
  // since a hidden-scrollbar overflow div isn't mouse-draggable by default.
  function enableDragScroll(el){
    if(!el || el.__dragBound) return;
    el.__dragBound = true;
    let dragging=false, startX=0, startScroll=0, moved=false;

    el.addEventListener('pointerdown', (e)=>{
      if(e.pointerType==='touch') return;
      dragging=true; moved=false;
      startX=e.clientX; startScroll=el.scrollLeft;
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const dx = e.clientX - startX;
      if(Math.abs(dx)>3) moved=true;
      el.scrollLeft = startScroll - dx;
    });
    function stop(){ dragging=false; el.classList.remove('dragging'); }
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    // Prevent the card tap-through when a drag just happened
    el.addEventListener('click', (e)=>{ if(moved){ e.stopPropagation(); moved=false; } }, true);

    el.addEventListener('wheel', (e)=>{
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        el.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive:false });
  }

  // ---------------- scoring ----------------
  function condAt(h, i){
    return {
      time:h.time[i],
      waveHeight:h.wave_height[i],
      swellHeight:h.swell_wave_height[i],
      swellPeriod:h.swell_wave_period[i],
      swellDir:h.swell_wave_direction[i],
      windWaveHeight:h.wind_wave_height[i],
      seaTemp:h.sea_surface_temperature[i],
      windSpeed:h.wind_speed_10m[i],
      windDir:h.wind_direction_10m[i],
      windGusts:h.wind_gusts_10m[i],
    };
  }

  function score(c, spot, level){
    // Deterministic seed based on spotId to break ties
    let seed = 0;
    for(let i=0;i<spot.id.length;i++){
        seed = (seed * 31 + spot.id.charCodeAt(i)) % 100;
    }
    const spotSeed = (seed - 50) / 10; // -5 to +5

    // Direction points: max 40 when swellDir ideal, 0 when opposite
    const swellDiff = angDiff(c.swellDir, mid(spot.idealSwellDir));
    const dirPoints = Math.max(0, 40 * (1 - swellDiff/180));

    // Period points: reward for period >= minPeriod, up to +8s gives max 30 pts
    let periodPoints = 0;
    if(c.swellPeriod >= spot.minPeriod){
        const extra = Math.min(c.swellPeriod - spot.minPeriod, 8);
        periodPoints = 30 * (extra / 8);
    }

    // Height points: reward for height within level's ideal range
    const range = LEVEL_RANGES[level];
    let heightPoints = 0;
    if(c.waveHeight >= range.min && c.waveHeight <= range.max){
        const rel = (c.waveHeight - range.min) / (range.max - range.min);
        heightPoints = 40 * rel;
    } else if(c.waveHeight < range.min){
        // penalty for too small: -80 per meter below min
        heightPoints = -80 * (range.min - c.waveHeight);
    } else {
        // penalty for too big: use abovePenalty * 2
        heightPoints = - (range.abovePenalty * 2) * (c.waveHeight - range.max);
    }

    // Wind points: offshore reward, onshore penalty, plus wind chop penalty
    const windDiff = angDiff(c.windDir, mid(spot.idealWindDir));
    const offshoreness = (90 - windDiff) / 90; // +1 exact offshore, 0 crosswind, -1 exact onshore
    const windFactor = Math.min(c.windSpeed,30)/30;
    let windPoints = 0;
    if(offshoreness > 0){
        windPoints = 30 * offshoreness * windFactor; // max 30
    } else {
        windPoints = 30 * offshoreness * windFactor; // negative reduces score
    }
    // wind chop penalty (always subtract)
    const windChopPenalty = Math.min(20, (c.windWaveHeight||0) * 16);
    windPoints -= windChopPenalty;

    // Sum all points plus seed, clamp to 0-100
    let s = dirPoints + periodPoints + heightPoints + windPoints + spotSeed;
    return Math.round(clamp(s,0,100));
  }

  // Map a verdict code (GO/MAYBE/SKIP) to the icon PNG.
  const VERDICT_ICONS = {
    GO:    'verdict-go.png',
    MAYBE: 'verdict-maybe.png',
    SKIP:  'verdict-skip.png'
  };
  const VERDICT_BG = {
    GO:    'rgba(63,199,154,0.18)',
    MAYBE: 'rgba(224,168,62,0.18)',
    SKIP:  'rgba(210,43,58,0.18)'
  };

  // Returns one of: 'GO' | 'MAYBE' | 'SKIP'
  function verdictCode(s){
    if(s>=75) return 'GO';
    if(s>=45) return 'MAYBE';
    return 'SKIP';
  }
  function verdict(s){
    const code = verdictCode(s);
    const label = code==='GO' ? 'DALE' : code==='MAYBE' ? 'QUIZÁS' : 'MEJOR NO';
    return { code, label, css: code==='GO' ? 'var(--go)' : code==='MAYBE' ? 'var(--maybe)' : 'var(--skip)' };
  }
  // Build the pill HTML for the hero (big icon on top, label below)
  function verdictPillHtml(v){
    return `<div class="verdict-pill">
      <img src="${VERDICT_ICONS[v.code]}" alt="${v.label}" onerror="this.style.display='none'">
      <span class="v-label" style="color:${v.css}">${v.label}</span>
    </div>`;
  }

  function reasonText(c, spot, level){
    const bits=[];
    const swellDiff = angDiff(c.swellDir, mid(spot.idealSwellDir));
    bits.push(swellDiff<30?'dirección de swell ideal':swellDiff<70?'dirección de swell aceptable':'dirección de swell poco favorable');
    bits.push(c.swellPeriod>=spot.minPeriod?'buen período':'período corto');
    const windDiff = angDiff(c.windDir, mid(spot.idealWindDir));
    const off = (90-windDiff)/90;
    bits.push(off>0.3?'viento offshore':off<-0.3?'viento onshore':'viento cruzado');
    if(c.windWaveHeight>0.4) bits.push('mar de viento presente');
    const range = LEVEL_RANGES[level];
    if(c.waveHeight<range.min) bits.push('chica para tu nivel');
    else if(c.waveHeight>range.max) bits.push('grande para tu nivel');
    return bits.join(' · ');
  }

  // best hour 8:00-19:00 for a given day
  function bestHourForDay(h, dateStr, spot, level){
    let best=null;
    for(let i=0;i<h.time.length;i++){
      if(dayKey(h.time[i])!==dateStr) continue;
      const hr = hourNum(h.time[i]);
      if(hr<8 || hr>19) continue;
      const c = condAt(h,i);
      const sc = score(c, spot, level);
      if(!best || sc>best.sc) best={c, sc};
    }
    return best;
  }

  function nextDays(h, n){
    const days=[];
    const seen=new Set();
    for(let i=0;i<h.time.length && days.length<n;i++){
      const dk = dayKey(h.time[i]);
      if(!seen.has(dk)){ seen.add(dk); days.push(dk); }
    }
    return days;
  }

  // ---------------- tides ----------------
  // Local tide model: harmonic sum of the 4 main constituents.
  // No API, no key, fully predictable. Coefficients come from SHOA
  // harmonic constants for the Maule coast.
  // Speeds in degrees per hour (Darwin).
  const TIDE_SPEEDS = { M2:28.9841042, S2:30.0000000, K1:15.0410686, O1:13.9430356 };
  // Epoch: J2000.0 (2000-01-01 12:00 UT) — used to convert phase to absolute.
  // We compute the argument for any timestamp t (ms) as:
  //   arg_i = speed_i * hoursSinceEpoch + g_i
  // where g_i is the phase in degrees at the epoch.
  const TIDE_EPOCH_MS = Date.UTC(2000,0,1,12,0,0)/1; // 946728000000

  // Coefficients per spot. H0 = mean level (m). H = amplitude (m), g = phase (deg).
  //
  // Two kinds of entries:
  //  - Per-spot: spots where local data is known (Curanipe, Constitución).
  //  - Master ports (prefixed with `port:`): SHOA tide-gauge stations used
  //    as a fallback for any spot that doesn't have its own coefficients.
  //    The region's `tideMaster` property selects which port is used.
  //
  // Spots without their own entry get the master's coefficients at runtime.
  // Source: SHOA Tabla de Mareas — harmonic constants for the central-
  // southern Chilean coast.
  const TIDE_COEFFS = {
    // ---- Master ports (SHOA) ----
    'port:talcahuano': { H0: 0.95, M2:{H:0.46,g:108}, S2:{H:0.16,g:128}, K1:{H:0.21,g:198}, O1:{H:0.12,g:208} },
    'port:sanantonio': { H0: 0.85, M2:{H:0.36,g:118}, S2:{H:0.13,g:140}, K1:{H:0.17,g:205}, O1:{H:0.10,g:215} },
    'port:valparaiso': { H0: 0.80, M2:{H:0.32,g:122}, S2:{H:0.12,g:142}, K1:{H:0.16,g:208}, O1:{H:0.09,g:218} },
    'port:arica':      { H0: 0.55, M2:{H:0.20,g:135}, S2:{H:0.07,g:155}, K1:{H:0.13,g:215}, O1:{H:0.07,g:225} },
    'port:corral':     { H0: 1.05, M2:{H:0.58,g:95},  S2:{H:0.20,g:115}, K1:{H:0.24,g:188}, O1:{H:0.14,g:198} },

    // ---- Per-spot overrides (where local data is known) ----
    curanipe:     { H0: 0.85, M2:{H:0.38,g:120}, S2:{H:0.12,g:135}, K1:{H:0.18,g:200}, O1:{H:0.10,g:210} },
    constitucion: { H0: 0.65, M2:{H:0.22,g:140}, S2:{H:0.07,g:155}, K1:{H:0.15,g:215}, O1:{H:0.08,g:225} }
  };

  // Resolve the tide coefficients for a spot: its own entry if present,
  // otherwise the region-level master port.
  function coeffsFor(spotId, regionId){
    if(TIDE_COEFFS[spotId]) return TIDE_COEFFS[spotId];
    const master = REGIONS[regionId] && REGIONS[regionId].tideMaster;
    if(master && TIDE_COEFFS['port:'+master]) return TIDE_COEFFS['port:'+master];
    return null;
  }

  function deg2rad(d){ return d*Math.PI/180; }

  function tidalHeight(spotId, tMs){
    // Note: the currentRegion is captured from the outer scope.
    const c = coeffsFor(spotId, currentRegion);
    if(!c) return 0;
    const hours = (tMs - TIDE_EPOCH_MS) / 3600000;
    let h = c.H0;
    for(const name of ['M2','S2','K1','O1']){
      const cn = c[name]; if(!cn) continue;
      h += cn.H * Math.cos(deg2rad(TIDE_SPEEDS[name]*hours + cn.g));
    }
    return h;
  }

  function tidalSeries(spotId, startMs, hours, stepMin){
    const stepMs = stepMin*60*1000;
    const n = Math.floor(hours*60/stepMin);
    const times = new Array(n);
    const heights = new Array(n);
    for(let i=0;i<n;i++){
      const t = startMs + i*stepMs;
      times[i] = new Date(t).toISOString();
      heights[i] = tidalHeight(spotId, t);
    }
    return { times, heights };
  }

  // Returns the high/low extrema (local maxima/minima) of a series,
  // using discrete derivative sign changes.
  function tidalExtrema(series){
    if(!series || series.heights.length < 3) return { highs:[], lows:[] };
    const highs=[], lows=[];
    for(let i=1;i<series.heights.length-1;i++){
      const a=series.heights[i-1], b=series.heights[i], c=series.heights[i+1];
      if(b>a && b>c) highs.push({ t: series.times[i], v: b });
      else if(b<a && b<c) lows.push({ t: series.times[i], v: b });
    }
    return { highs, lows };
  }

  function fetchTidesAll(){
    try{
      const spots = getCurrentSpots();
      const out = {};
      spots.forEach(s => {
        try{
          const now = Date.now();
          const start = now - (now % 3600000);
          const series = tidalSeries(s.id, start, 24, 60);
          if(series && series.times && series.times.length) out[s.id] = series;
        }catch(err){
          console.error("[tide] error computing for " + s.id, err);
        }
      });
      window.__tidesLast = out;
  console.log("[tide] fetchTidesAll returned, keys:", Object.keys(out), "curanipe pts:", out.curanipe ? out.curanipe.times.length : "MISSING");
      console.log("[tide] OK keys=" + Object.keys(out).join(",") + " count=" + Object.keys(out).length);
      return out;
    }catch(topErr){
      console.error("[tide] top-level error", topErr);
      return {};
    }
  }


  function loadTidesCache(region){
    try{
      const raw = localStorage.getItem(TIDES_CACHE_KEY);
      if(!raw) return null;
      const all = JSON.parse(raw);
      const entry = all[region];
      if(!entry || !entry.data) return null;
      if(Date.now()-entry.ts > TIDES_TTL_MS) return null;
      // Validate the shape: each spot must have a `times` array and a `heights` array.
      // Old WorldTides caches had a different shape — discard them.
      for(const spotId of Object.keys(entry.data)){
        const s = entry.data[spotId];
        if(!s || !Array.isArray(s.times) || !Array.isArray(s.heights) || s.times.length < 4){
          return null;
        }
      }
      return entry.data;
    }catch(e){ return null; }
  }

  // Drop any tides cached under the old WorldTides schema so we don't
  // serve stale data once the new provider is wired in.
  (function purgeStaleTidesCache(){
    try{
      localStorage.removeItem(TIDES_CACHE_KEY);
    }catch(e){}
  })();
  function saveTidesCache(region, data){
    try{
      const raw = localStorage.getItem(TIDES_CACHE_KEY);
      const all = raw ? JSON.parse(raw) : {};
      all[region] = { ts: Date.now(), data };
      localStorage.setItem(TIDES_CACHE_KEY, JSON.stringify(all));
    }catch(e){}
  }

  // ---------------- data ----------------
  async function fetchAll(){
    const spots = getCurrentSpots();
    const lats = spots.map(s=>s.lat).join(',');
    const lons = spots.map(s=>s.lon).join(',');

    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lats}&longitude=${lons}&hourly=wave_height,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height,sea_surface_temperature&forecast_days=5&timezone=auto`;
    const windUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&forecast_days=5&timezone=auto`;

    const [mRes,wRes] = await Promise.all([fetch(marineUrl), fetch(windUrl)]);
    if(!mRes.ok || !wRes.ok) throw new Error('fetch failed');
    const mData = await mRes.json();
    const wData = await wRes.json();
    const mArr = Array.isArray(mData)?mData:[mData];
    const wArr = Array.isArray(wData)?wData:[wData];

    return spots.map((spot,i)=>{
      const mh = mArr[i].hourly, wh = wArr[i].hourly;
      return {
        spot,
        hourly:{
          time:mh.time,
          wave_height:mh.wave_height,
          swell_wave_height:mh.swell_wave_height,
          swell_wave_period:mh.swell_wave_period,
          swell_wave_direction:mh.swell_wave_direction,
          wind_wave_height:mh.wind_wave_height,
          sea_surface_temperature:mh.sea_surface_temperature,
          wind_speed_10m:wh.wind_speed_10m,
          wind_direction_10m:wh.wind_direction_10m,
          wind_gusts_10m:wh.wind_gusts_10m,
        }
      };
    });
  }

  // Cache is a map: { [regionId]: { ts, data } }
  function loadCache(region){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const all = JSON.parse(raw);
      const entry = all[region];
      if(!entry) return null;
      if(Date.now()-entry.ts > CACHE_TTL_MS) return null;
      return entry.data;
    }catch(e){ return null; }
  }
  function saveCache(region, data){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      const all = raw ? JSON.parse(raw) : {};
      all[region] = { ts: Date.now(), data };
      localStorage.setItem(CACHE_KEY, JSON.stringify(all));
    }catch(e){}
  }

  // Hover/touch on the tide chart: show a tooltip with the time, height,
  // and rising/falling trend at the cursor position.
  // The chart uses preserveAspectRatio="none" so we have to convert
  // client coordinates into the viewBox manually.
  function enableTideTooltip(){
    const chart = document.querySelector(".tide-chart");
    const svg   = chart && chart.querySelector("svg");
    const hit   = chart && chart.querySelector(".tide-hit");
    const tip   = document.getElementById("tideTooltip");
    const line  = document.getElementById("tideCursorLine");
    const dot   = document.getElementById("tideCursorDot");
    const ttTime = document.getElementById("ttTime");
    const ttH    = document.getElementById("ttHeight");
    const ttArr  = document.getElementById("ttArr");
    const ttTr   = document.getElementById("ttTrend");
    if(!chart || !svg || !hit || !tip || !line || !dot) return;

    // We need the actual viewBox dimensions. The SVG was rendered with
    // viewBox="0 0 W H" so we can read W,H from the attribute string.
    const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    const W = vb[2], H = vb[3];

    // Get the series in raw form (from the closure). We stash it on the
    // element so we don't have to recompute.
    const series = (window.__tidesLast || {})[Object.keys(window.__tidesLast || {})[0]];
    // That grabs the first spot, but for the primary spot we need the
    // matching one. The renderTide() function already knows; we pass it
    // via a data attribute.
    const spotId = chart.getAttribute("data-spot") || "curanipe";
    const data = (window.__tidesLast || {})[spotId];
    if(!data || !data.times || data.times.length < 2) return;

    // SVG coord <-> screen coord helpers
    const ctm = () => svg.getScreenCTM();
    const xToTime = (clientX) => {
      const m = ctm(); if(!m) return null;
      // inverse: client -> svg viewBox coords
      const inv = m.inverse();
      const pt = svg.createSVGPoint();
      pt.x = clientX; pt.y = 0;
      const local = pt.matrixTransform(inv);
      // local.x is in viewBox space (0..W). Map to a point in the series.
      const frac = clamp(local.x / W, 0, 1);
      const idx = Math.round(frac * (data.times.length - 1));
      return { idx, t: new Date(data.times[idx]).getTime(), v: data.heights[idx] };
    };
    const showAt = (clientX) => {
      const hit_ = xToTime(clientX); if(!hit_) return;
      const { idx, t, v } = hit_;
      // X position in viewBox coords:
      const xVb = (idx / (data.times.length - 1)) * W;
      const yVb = yOfForSeries(data, v, H);
      line.setAttribute("x1", xVb); line.setAttribute("x2", xVb);
      dot.setAttribute("cx", xVb);  dot.setAttribute("cy", yVb);
      // Trend: compare to next point (rising if next > current)
      const next = data.heights[Math.min(idx+1, data.heights.length-1)];
      const prev = data.heights[Math.max(idx-1, 0)];
      const rising = next > v;
      const dh = (next - v) * 100;
      ttTime.textContent = new Date(t).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
      ttH.textContent    = v.toFixed(2) + " m";
      ttArr.textContent  = rising ? "↑" : "↓";
      ttArr.className    = "t-arr " + (rising ? "up" : "down");
      ttTr.textContent   = (dh>=0?"+":"") + dh.toFixed(1) + " cm/h · " + (rising ? "subiendo" : "bajando");
      // Position the tooltip in screen space, accounting for chart size
      const rect = chart.getBoundingClientRect();
      const tipX = (xVb / W) * rect.width;
      const tipY = (yVb / H) * rect.height;
      // Clamp so the tooltip doesn't fall off the edges
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = tipX;
      if(left < tw/2 + 6) left = tw/2 + 6;
      if(left > rect.width - tw/2 - 6) left = rect.width - tw/2 - 6;
      let top = tipY - 6;
      if(top < th + 4) top = tipY + 18;
      tip.style.left = left + "px";
      tip.style.top  = top + "px";
      tip.classList.add("show");
    };
    const hide = () => tip.classList.remove("show");

    hit.addEventListener("mousemove", e => showAt(e.clientX));
    hit.addEventListener("mouseleave", hide);
    // Touch: tap to pin, tap again to release
    hit.addEventListener("touchstart", e => {
      if(!e.touches.length) return;
      showAt(e.touches[0].clientX);
      e.preventDefault();
    }, { passive:false });
  }

  // Y-scale helper, mirrors the math inside renderTide so the tooltip
  // sits on the exact curve.
  function yOfForSeries(data, v, H){
    let ymin = Infinity, ymax = -Infinity;
    for(const h of data.heights){ if(h<ymin) ymin=h; if(h>ymax) ymax=h; }
    if(ymin === ymax){ ymin -= 0.1; ymax += 0.1; }
    const ypad = (ymax - ymin) * 0.10;
    ymin -= ypad; ymax += ypad;
    const PAD_TOP = 6, PAD_BOT = 4;
    return PAD_TOP + (1 - (v - ymin) / (ymax - ymin)) * (H - PAD_TOP - PAD_BOT);
  }

  // ---------------- render ----------------
  function movePill(idx){
    document.getElementById('segPill').style.transform = `translateX(${idx*100}%)`;
  }

  // Build the tide chart SVG for a spot. Returns an HTML string or '' if
  // we don't have enough data.
  function renderTide(spotId){
    const series = tides && tides[spotId];

    // Expose last computed series for debugging from the console.
    if(series){
      window.__tideDebug = {
        spotId,
        points: series.times.length,
        first: { t: series.times[0], v: series.heights[0]?.toFixed(3) },
        last:  { t: series.times[series.times.length-1], v: series.heights[series.heights.length-1]?.toFixed(3) },
        extrema: tidalExtrema(series)
      };
    } else {
      window.__tideDebug = { spotId, error: 'no series' };
    }

    if(!series || !series.times || series.times.length < 4){
      return `<div class="tide"><div class="tide-empty">Marea no disponible para este spot</div></div>`;
    }

    const W = 320, H = 72;
    const PAD_X = 6, PAD_TOP = 6, PAD_BOT = 4;

    // The local tide series is already 24h starting at the current hour,
    // step 60 min. Use it directly — no re-filtering needed.
    const pts = series.times.map((t, i) => ({ t: new Date(t).getTime(), v: series.heights[i] }));
    if(pts.length < 4) return '';

    // Y scale (auto)
    let ymin = Infinity, ymax = -Infinity;
    for(const p of pts){ if(p.v<ymin) ymin=p.v; if(p.v>ymax) ymax=p.v; }
    if(ymin === ymax){ ymin -= 0.1; ymax += 0.1; }
    const ypad = (ymax - ymin) * 0.10;
    ymin -= ypad; ymax += ypad;
    const t0 = pts[0].t, t1 = pts[pts.length-1].t;
    const xOf = (t) => PAD_X + ((t - t0) / (t1 - t0)) * (W - 2*PAD_X);
    const yOf = (v) => PAD_TOP + (1 - (v - ymin) / (ymax - ymin)) * (H - PAD_TOP - PAD_BOT);

    // Build the area path
    let path = `M ${xOf(pts[0].t).toFixed(1)} ${yOf(pts[0].v).toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      path += ` L ${xOf(pts[i].t).toFixed(1)} ${yOf(pts[i].v).toFixed(1)}`;
    }
    const areaPath = path + ` L ${xOf(pts[pts.length-1].t).toFixed(1)} ${H} L ${xOf(pts[0].t).toFixed(1)} ${H} Z`;

    // "Now" marker = the point closest to the current wall-clock time.
    // The series is hourly, so the first point is the current hour.
    const nowMs = Date.now();
    let nowIdx = 0, bestDelta = Infinity;
    for(let i=0;i<pts.length;i++){
      const d = Math.abs(pts[i].t - nowMs);
      if(d < bestDelta){ bestDelta = d; nowIdx = i; }
    }
    const nowPt = pts[nowIdx];
    const nowX = xOf(nowPt.t);
    const nowY = yOf(nowPt.v);

    // Trend at "now": rising or falling (compare to the next point)
    const nextPt = pts[Math.min(nowIdx+1, pts.length-1)];
    const rising = nextPt.v > nowPt.v;
    const trendLabel = rising ? 'Subiendo' : 'Bajando';
    const trendCls = rising ? 'up' : 'down';
    // cm/h change for context
    const dh = (nextPt.v - nowPt.v) * 100;
    const trendVal = `${dh>=0?'+':''}${dh.toFixed(0)} cm/h`;

    // First high and first low extremes (locales) in the visible window
    function findExtremes(ascending){
      const extremes = [];
      for(let i=1;i<pts.length-1;i++){
        if(ascending){
          if(pts[i].v > pts[i-1].v && pts[i].v > pts[i+1].v) extremes.push(pts[i]);
        }else{
          if(pts[i].v < pts[i-1].v && pts[i].v < pts[i+1].v) extremes.push(pts[i]);
        }
      }
      return extremes;
    }
    const highs = findExtremes(true);
    const lows  = findExtremes(false);
    const firstHigh = highs[0];
    const firstLow  = lows[0];

    // X axis labels: show 4-5 evenly-spaced hour marks across the 24h window.
    const xlabels = [];
    const STEP = 6; // every 6h
    for(let i=0; i<pts.length; i+=STEP){
      xlabels.push({
        t: pts[i].t,
        label: new Date(pts[i].t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})
      });
    }
    // Always include the last point so the right edge has a label.
    const last = pts[pts.length-1];
    if(!xlabels.length || xlabels[xlabels.length-1].t !== last.t){
      xlabels.push({ t: last.t, label: new Date(last.t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) });
    }

    function fmtHour(t){
      return new Date(t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    }

    const extras = [];
    if(firstHigh) extras.push(`<span><b>↑</b> Pleamar ${fmtHour(firstHigh.t)} (${firstHigh.v.toFixed(1)} m)</span>`);
    if(firstLow)  extras.push(`<span><b>↓</b> Bajamar ${fmtHour(firstLow.t)} (${firstLow.v.toFixed(1)} m)</span>`);

    return `
      <div class="tide anim-tide">
        <div class="tide-head">
          <span class="lbl">Marea · próximas 24 h</span>
          <span class="state ${trendCls}">${trendLabel} <span class="arr">→</span> <span style="opacity:0.7;font-weight:500">${trendVal}</span></span>
        </div>
        <div class="tide-chart" data-spot="${spotId}">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Curva de marea">
            <defs>
              <linearGradient id="tideGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="#4DA3FF" stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path class="tide-curve-bg" d="${areaPath}" fill="url(#tideGrad)"/>
            <path class="tide-curve" d="${path}" fill="none" stroke="#E8F1FF" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
            <line class="tide-now-marker" x1="${nowX.toFixed(1)}" y1="0" x2="${nowX.toFixed(1)}" y2="${H}" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="2 3"/>
            <circle class="tide-now-marker" cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="3.2" fill="#D22B3A" stroke="#fff" stroke-width="1.2"/>
            <g class="tide-cursor">
              <line id="tideCursorLine" x1="0" y1="0" x2="0" y2="${H}" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
              <circle id="tideCursorDot" cx="0" cy="0" r="4" fill="#E8F1FF" stroke="#0B2545" stroke-width="1.2" class="tide-dot-hover"/>
            </g>
            <rect class="tide-hit" x="0" y="0" width="${W}" height="${H}"/>
          </svg>
          <div class="tide-tooltip" id="tideTooltip">
            <div class="t-time" id="ttTime">--:--</div>
            <div class="t-row"><span>Altura</span><b id="ttHeight">— m</b></div>
            <div class="t-row"><span class="t-arr" id="ttArr">→</span><span id="ttTrend">—</span></div>
          </div>
        </div>
        <div class="tide-xaxis">
          ${xlabels.map(x => `<span>${x.label}</span>`).join('')}
        </div>
        ${extras.length ? `<div class="tide-extras">${extras.join('')}</div>` : ''}
      </div>
    `;
  }
  function movePill(idx){
    document.getElementById('segPill').style.transform = `translateX(${idx*100}%)`;
  }

  function populateRegions(){
    const sel = document.getElementById('regionSelect');
    sel.innerHTML = '';
    REGION_ORDER.forEach(rid => {
      if(!REGIONS[rid]) return;
      const opt = document.createElement('option');
      opt.value = rid;
      opt.textContent = REGIONS[rid].name;
      sel.appendChild(opt);
    });
    sel.value = currentRegion;
  }

  function render(){
    if(!raw) return;

    const scored = raw.map(r=>{
      const idx = nearestIndex(r.hourly.time);
      const c = condAt(r.hourly, idx);
      const sc = score(c, r.spot, currentLevel);
      const days = nextDays(r.hourly, 5).map(dk => ({
        dk, best: bestHourForDay(r.hourly, dk, r.spot, currentLevel)
      }));
      return { r, c, sc, v:verdict(sc), days };
    });

    // Primary: user-selected if any, otherwise the highest-scored spot.
    // The "rest" list always shows the other spots (in score order, top first).
    const byScore = [...scored].sort((a,b)=>b.sc-a.sc);
    if (SHOW_DEBUG) {
      console.log('DEBUG: scored array', scored.map(s => ({
        spot: s.r.spot.id,
        score: s.sc,
        verdict: s.v.code,
        swellHeight: s.c.swellHeight,
        swellPeriod: s.c.swellPeriod,
        swellDir: s.c.swellDir,
        windSpeed: s.c.windSpeed,
        windDir: s.c.windDir
      })));
    }
    let primary;
    if(selectedSpotId){
      primary = scored.find(s => s.r.spot.id === selectedSpotId) || byScore[0];
    } else {
      primary = byScore[0];
    }
    const rest = byScore.filter(s => s.r.spot.id !== primary.r.spot.id);

    // Pick the time slice for the hero.
    // - If a day is selected (0..4) and that day's `best` exists, use it.
    // - Otherwise, use the hour closest to now.
    let idx, heroTimeMs;
    const dayPick = (selectedDayIdx !== null && primary.days[selectedDayIdx] && primary.days[selectedDayIdx].best)
      ? primary.days[selectedDayIdx]
      : null;
    if(dayPick){
      const t = new Date(dayPick.best.c.time).getTime();
      idx = nearestIndex(primary.r.hourly.time);
      // Find the index whose time matches `t` exactly (or nearest)
      let bestI = 0, bestD = Infinity;
      for(let i=0;i<primary.r.hourly.time.length;i++){
        const d = Math.abs(new Date(primary.r.hourly.time[i]).getTime() - t);
        if(d < bestD){ bestD = d; bestI = i; }
      }
      idx = bestI;
      heroTimeMs = t;
    } else {
      idx = nearestIndex(primary.r.hourly.time);
      heroTimeMs = new Date(primary.r.hourly.time[idx]).getTime();
    }
    const updatedTime = new Date(heroTimeMs).toLocaleString('es-CL',{weekday:'short',hour:'2-digit',minute:'2-digit'});

    // hourly strip: 8 hours centered on the hero time (4 before, 4 after)
    let hourlyHtml = '';
    const startI = Math.max(0, idx - 4);
    for(let i=startI, n=0; i<primary.r.hourly.time.length && n<8; i++, n++){
      const c = condAt(primary.r.hourly, i);
      const isCenter = (i === idx);
      const label = isCenter
        ? 'Mejor'
        : new Date(c.time).toLocaleTimeString('es-CL',{hour:'2-digit'});
      hourlyHtml += `
        <div class="hour-chip" ${isCenter ? 'style="background:rgba(210,43,58,0.18);border-color:rgba(210,43,58,0.55);"' : ''}>
          <div class="t">${label}</div>
          ${arrowSpan(c.swellDir)}
          <div class="h">${c.swellHeight.toFixed(1)}m</div>
        </div>`;
    }

    // Day labels: "Hoy" / "Mañana" for the first two, then the weekday
    // name in lower-case (e.g. "miércoles") for the rest.
    function dayLabel(i, dk){
      if(i === 0) return 'Hoy';
      if(i === 1) return 'Mañana';
      // dk is a YYYY-MM-DD; parse in local time to get the right weekday
      const d = new Date(dk + 'T12:00:00');
      return d.toLocaleDateString('es-CL',{weekday:'long'});
    }
    const dayBoxes = primary.days.map((d,i)=>{
      const hasBest = !!d.best;
      const isSelected = (selectedDayIdx === i);
      const cls = ['day-box'];
      if(hasBest) cls.push('has-best');
      if(isSelected) cls.push('selected');
      const onclick = hasBest ? `onclick="window.__selectDay(${i})"` : '';
      return `<div class="${cls.join(' ')}" data-day-idx="${i}" ${onclick} style="--i:${i}">
        <div class="dl">${dayLabel(i, d.dk)}</div>
      </div>`;
    }).join('');

    // Hero label: reflects what's currently shown
    let heroLabel;
    if(selectedDayIdx !== null && dayPick){
      heroLabel = dayLabel(selectedDayIdx, dayPick.dk) + ' · ' + new Date(heroTimeMs).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    } else if(selectedSpotId){
      heroLabel = 'Spot seleccionado';
    } else {
      heroLabel = 'Mejor opción ahora';
    }

    let html = `
      <div class="glass hero anim-fade-up">
        <p class="hero-label">${heroLabel}</p>
        <p class="hero-spot">${primary.r.spot.name}</p>
        <div class="hero-main">
          <div class="hero-num anim-tick">${primary.c.swellHeight.toFixed(1)}<small>m</small></div>
          <div class="anim-pop">${verdictPillHtml(primary.v)}</div>
        </div>
        <div class="meta-row">
          <div class="meta"><div class="n">${Math.round(primary.c.swellPeriod)}s</div><div class="l">Período</div></div>
          <div class="meta"><div class="n">${arrowSpan(primary.c.swellDir)} ${dirLabel(primary.c.swellDir)}</div><div class="l">Swell</div></div>
          <div class="meta"><div class="n">${Math.round(primary.c.windSpeed)}km/h</div><div class="l">Viento ${dirLabel(primary.c.windDir)}</div></div>
          <div class="meta"><div class="n">${Math.round(primary.c.seaTemp)}°C</div><div class="l">Agua</div></div>
        </div>
        <div class="hourly-wrap">
          <div class="hourly-scroll">${hourlyHtml}</div>
        </div>
        ${renderTide(primary.r.spot.id)}
        <p class="reason">${reasonText(primary.c, primary.r.spot, currentLevel)}</p>
        <div class="daily-detail stagger">${dayBoxes}</div>
        <p class="updated">Actualizado ${updatedTime}</p>
      </div>

      <p class="section-title">Otros spots del ${REGIONS[currentRegion].name}</p>
    `;

    rest.forEach(({r,c,sc,v,days}, i)=>{
      html += `
        <div class="glass card" data-id="${r.spot.id}" style="--i:${i}">
          <div class="card-head" onclick="window.__selectSpot('${r.spot.id}')">
            <div class="name-wrap">
              <span class="dot" style="background:${v.css}"></span>
              <div>
                <div class="name">${r.spot.name}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    });

    const content = document.getElementById('content');
    content.innerHTML = html;
    // Force a reflow so the entrance animations actually run after innerHTML
    // is assigned (otherwise the browser may batch and skip them).
    void content.offsetWidth;
    // Measure the tide curve's actual length and pass it as a CSS var so
    // the draw-in animation matches the path exactly.
    const curve = content.querySelector(".tide-curve");
    if(curve){
      try{
        const len = curve.getTotalLength();
        curve.style.setProperty("--len", len);
        // Restart the animation now that --len is set (otherwise the
        // initial frame would have used the fallback 1000).
        curve.style.animation = "none";
        void curve.offsetWidth;
        curve.style.animation = "";
      }catch(e){ /* getTotalLength not supported → animation still runs with fallback */ }
    }
    enableDragScroll(document.querySelector('.hourly-scroll'));
    try{ enableTideTooltip(); }catch(err){ console.error("[tooltip] failed", err); }
    initGSAPAnimations();
      }

  // Public: clicking a card in the "Otros spots" list promotes it to primary.
  window.__selectSpot = function(id){
    selectedSpotId = id;
    selectedDayIdx = null; // changing spot also clears day selection
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Public: clicking a day-box in the hero pins the hero to that day's
  // best hour for the current primary spot.
  window.__selectDay = function(i){
    selectedDayIdx = (selectedDayIdx === i) ? null : i; // toggle on re-click
    render();
    // Re-trigger the pulse animation on the clicked day-box by toggling a
    // dedicated class (avoids the CSS rule being ignored on re-application).
    const box = document.querySelector(`.day-box[data-day-idx="${i}"]`);
    if(box){
      box.classList.remove("pulse");
      // force reflow so removing+re-adding actually restarts the animation
      void box.offsetWidth;
      box.classList.add("pulse");
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function renderError(){
    document.getElementById('content').innerHTML = `
      <div class="glass msg">
        No pudimos leer el mar ahora mismo.
        <div><button id="retryBtn">Reintentar</button></div>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', init);
  }

  function initGSAPAnimations() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    gsap.from('.glass.hero', { opacity: 0, y: 20, duration: 0.8, ease: 'power3.out' });
    gsap.from('.hero-num', { opacity: 0, y: -10, duration: 0.6, ease: 'power2.out' });
    gsap.from('.anim-pop', { opacity: 0, scale: 0.8, duration: 0.6, ease: 'back.out(1.7)' });
    gsap.from('.tide-chart', { opacity: 0, duration: 0.8, ease: 'power3.out' });
    gsap.from('.day-box', { opacity: 0, y: 10, duration: 0.6, ease: 'power3.out', stagger: 0.08 });
    gsap.utils.toArray('.card').forEach((card, i) => {
      const idHash = card.dataset.id ? hashCode(card.dataset.id) : i;
      gsap.to(card, {
        y: () => Math.sin(Date.now() * 0.002 + idHash) * 3,
        duration: 6,
        ease: 'sine.inOut',
        repeat: -1,
        yoyo: true
      });
    });
    gsap.utils.toArray('.level-btn').forEach(btn => {
      btn.addEventListener('pointerenter', () => gsap.to(btn, { scale: 1.05, duration: 0.2 }));
      btn.addEventListener('pointerleave', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
      btn.addEventListener('pointerdown', () => gsap.to(btn, { scale: 0.95, duration: 0.1 }));
      btn.addEventListener('pointerup', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
    });
    const regionSelect = document.querySelector('.select-wrap');
    if (regionSelect) {
      regionSelect.addEventListener('pointerenter', () => gsap.to(regionSelect, { scale: 1.02, duration: 0.2 }));
      regionSelect.addEventListener('pointerleave', () => gsap.to(regionSelect, { scale: 1, duration: 0.2 }));
    });
    gsap.utils.toArray('.section-title').forEach((section, index) => {
      gsap.from(section, {
        opacity: 0,
        y: 20,
        duration: 0.8,
        ease: 'power3.out',
        delay: index * 0.1,
        scrollTrigger: { trigger: section, start: 'top 80%', toggleActions: 'play none none reverse' }
      });
    });
  }
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return hash;
  }

  function initGSAPAnimations() {
  // Respect user's motion preference
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // Hero fade-up
  gsap.from('.glass.hero', { opacity: 0, y: 20, duration: 0.8, ease: 'power3.out' });
  // Hero number tick in
  gsap.from('.hero-num', { opacity: 0, y: -10, duration: 0.6, ease: 'power2.out' });
  // Verdict pill pop
  gsap.from('.anim-pop', { opacity: 0, scale: 0.8, duration: 0.6, ease: 'back.out(1.7)' });
  // Tide chart fade in
  gsap.from('.tide-chart', { opacity: 0, duration: 0.8, ease: 'power3.out' });
  // Staggered day boxes
  gsap.from('.day-box', { opacity: 0, y: 10, duration: 0.6, ease: 'power3.out', stagger: 0.08 });
  // Card float animation
  gsap.utils.toArray('.card').forEach((card, i) => {
    const idHash = card.dataset.id ? hashCode(card.dataset.id) : i;
    gsap.to(card, {
      y: () => Math.sin(Date.now() * 0.002 + idHash) * 3,
      duration: 6,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true
    });
  });
  // Button microinteractions
  gsap.utils.toArray('.level-btn').forEach(btn => {
    btn.addEventListener('pointerenter', () => gsap.to(btn, { scale: 1.05, duration: 0.2 }));
    btn.addEventListener('pointerleave', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
    btn.addEventListener('pointerdown', () => gsap.to(btn, { scale: 0.95, duration: 0.1 }));
    btn.addEventListener('pointerup', () => gsap.to(btn, { scale: 1, duration: 0.2 }));
  });
  // Region select microinteraction (on the select container)
  const regionSelect = document.querySelector('.select-wrap');
  if (regionSelect) {
    regionSelect.addEventListener('pointerenter', () => gsap.to(regionSelect, { scale: 1.02, duration: 0.2 }));
    regionSelect.addEventListener('pointerleave', () => gsap.to(regionSelect, { scale: 1, duration: 0.2 }));
  }
  // Scroll-triggered animations for sections
  gsap.utils.toArray('.section-title').forEach((section, index) => {
    gsap.from(section, {
      opacity: 0,
      y: 20,
      duration: 0.8,
      ease: 'power3.out',
      delay: index * 0.1,
      scrollTrigger: {
        trigger: section,
        start: 'top 80%',
        toggleActions: 'play none none reverse'
      }
    });
  });

  }
  // Simple hash code function for string
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return hash;
  }
  // ---------------- init ----------------
  async function init(){
    document.getElementById('content').innerHTML = `<div class="glass msg">Leyendo el mar…</div>`;
    selectedSpotId = null;
    selectedDayIdx = null;

    const cached = loadCache(currentRegion);
    const cachedTides = loadTidesCache(currentRegion);

    // Oleaje + viento: si no hay caché, fallar = pantalla de error
    if(cached){
      raw = cached;
    }else{
      try{
        raw = await fetchAll();
        saveCache(currentRegion, raw);
      }catch(e){ renderError(); return; }
    }

    // Mareas: opcional, sin caché = intentar fetch, fallo = sin gráfico
    if(cachedTides){
      console.log("[init] tides from cache, keys:", Object.keys(cachedTides));
      tides = cachedTides;
    }else{
      try{
        console.log("[init] calling fetchTidesAll...");
        tides = await fetchTidesAll();
        console.log("[init] fetchTidesAll done, keys:", Object.keys(tides || {}));
        if(tides && Object.keys(tides).length) saveTidesCache(currentRegion, tides);
      }catch(e){
        console.error("[init] fetchTidesAll failed", e);
        tides = null; // sin gráfico de marea, app sigue funcionando
      }
    }

    console.log("[init] before render, tides keys:", Object.keys(tides || {}));
    render();
    console.log("[init] after render, content html length:", document.getElementById("content").innerHTML.length);
  }

  // region change: refetch for the new region (cache-aware)
  document.getElementById('regionSelect').addEventListener('change', (e)=>{
    currentRegion = e.target.value;
    tides = null;
    selectedSpotId = null;
    selectedDayIdx = null;
    init();
  });

  document.getElementById('levelSelect').addEventListener('click', (e)=>{
    const btn = e.target.closest('.level-btn');
    if(!btn) return;
    currentLevel = btn.dataset.level;
    document.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('active', b===btn));
    movePill(parseInt(btn.dataset.idx,10));
    // Reset the day picker so the user sees the new score, not a stale one
    selectedDayIdx = null;
    render();
  });

  // boot
  populateRegions();
  const startIdx = LEVEL_ORDER.indexOf(currentLevel);
  document.querySelector(`.level-btn[data-level="${currentLevel}"]`).classList.add('active');
  movePill(startIdx);

  // Drop the wave cache from before the 5-day change. The marine URL now
  // requests forecast_days=5, so any cached data with <5 days would render
  // "—" for the last 2 day-boxes.
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  // Drop the tide cache too — new spots + master-port fallback structure.
  try{ localStorage.removeItem(TIDES_CACHE_KEY); }catch(e){}

  // Expose tide functions globally for console debugging.
  window.__tide = { tidalSeries, tidalHeight, fetchTidesAll, tidalExtrema, TIDE_COEFFS };

  init();

})();
</script>
</body>
</html>
