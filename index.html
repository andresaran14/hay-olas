<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
    position:relative;
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¿Hay Olas?">
<meta name="theme-color" content="#061021">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>¿Hay Olas? — Chile</title>
<!-- GSAP for premium animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root{
    --bg-top:#0B2545;
    --bg-bot:#061021;
    --glass:rgba(255,255,255,0.08);
    --glass-strong:rgba(255,255,255,0.13);
    --glass-line:rgba(255,255,255,0.14);
    --glass-line-bright:rgba(255,255,255,0.28);
    --ink:#F7F5EF;
    --ink-dim:rgba(247,245,239,0.62);
    --ink-faint:rgba(247,245,239,0.4);
    --red:#D22B3A;
    --go:#3FC79A;
    --maybe:#E0A83E;
    --skip:#D22B3A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #14315C 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  /* iOS safe areas — the status bar / home indicator areas.
     Fallbacks are for browsers that don't support env() yet. */
  padding-top: env(safe-area-inset-top, 0);
  padding-bottom: env(safe-area-inset-bottom, 0);
  padding-left: env(safe-area-inset-left, 0);
  padding-right: env(safe-area-inset-right, 0);
}

body::before,
body::after{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:-2;
}
body::before{
  background:radial-gradient(120% 60% at 50% -10%, rgba(20,49,92,0.25) 0%, transparent 60%);
  animation:waveBG 8s ease-in-out infinite;
}
body::after{
  background:radial-gradient(120% 60% at 50% 10%, rgba(40,80,120,0.15) 0%, transparent 50%);
  animation:waveBG 10s ease-in-out infinite reverse;
}
@keyframes waveBG{
  0%,100%{ background-position:0% 0%; }
  50%{ background-position:100% 100%; }
}
.wrap{
  max-width:460px;
  margin:0 auto;
  padding:26px 18px max(56px, calc(56px + env(safe-area-inset-bottom, 0px)));
}
